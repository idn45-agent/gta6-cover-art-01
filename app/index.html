<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Hour — Cover Art Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e8546d'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">VH</span> Vice Hour <em>cover art studio</em></div>
  <div class="top-actions">
    <button id="btn-undo" type="button">Undo</button>
    <button id="btn-redo" type="button">Redo</button>
    <button id="btn-shuffle" type="button">Shuffle look</button>
  </div>
</header>

<main class="workspace">
  <section class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="stage-canvas" width="1080" height="1080"></canvas>
    </div>
    <p class="hint">Drag on the cover to pan the selected panel. Scroll to zoom it. Click a panel to select it.</p>
    <div class="export-bar">
      <span>Export PNG:</span>
      <button type="button" data-export="1080x1080">1080 × 1080</button>
      <button type="button" data-export="1080x1350">1080 × 1350</button>
      <button type="button" data-export="1920x1080">1920 × 1080</button>
      <button type="button" data-export="1080x1920">1080 × 1920 story</button>
      <button type="button" id="btn-export-all">Export all sizes</button>
    </div>
  </section>

  <aside class="panel">
    <fieldset>
      <legend>Photos</legend>
      <label class="file-btn">Add your photos
        <input id="file-input" type="file" accept="image/*" multiple hidden>
      </label>
      <div class="sample-row">
        <button type="button" id="btn-sample-pier">Sample: Pier</button>
        <button type="button" id="btn-sample-boulevard">Sample: Boulevard</button>
      </div>
      <div id="photo-strip" class="photo-strip"></div>
      <div class="row">
        <label>Selected panel <select id="panel-select"></select></label>
        <label>Panel photo <select id="panel-photo"></select></label>
      </div>
      <div class="row">
        <label>Zoom <input id="panel-zoom" type="range" min="1" max="3" step="0.02" value="1"></label>
        <button type="button" id="btn-swap">Swap first two panels</button>
      </div>
      <label class="check"><input id="ink-toggle" type="checkbox"> Ink / posterize panels</label>
    </fieldset>

    <fieldset>
      <legend>Words</legend>
      <label>Caption <input id="caption-input" type="text" maxlength="26" value="VICE HOUR"></label>
      <label>Subtitle (script) <input id="subtitle-input" type="text" maxlength="40" value="one last ride"></label>
      <label>Title treatment
        <select id="treatment-select">
          <option value="gradient">Gradient capitals</option>
          <option value="halftone-block">Halftone block</option>
          <option value="outline-chrome">Outline chrome</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Layout &amp; grade</legend>
      <label>Layout <select id="layout-select"></select></label>
      <label>Colour grade <select id="grade-select"></select></label>
      <div class="preset-grid" id="preset-grid"></div>
    </fieldset>

    <fieldset>
      <legend>Decorations</legend>
      <label class="check"><input type="checkbox" data-deco="badge" checked> Star-burst badge</label>
      <label>Badge text <input id="badge-input" type="text" maxlength="18" value="VICE HOUR"></label>
      <label class="check"><input type="checkbox" data-deco="stars" checked> Heat-meter stars</label>
      <label class="check"><input type="checkbox" data-deco="issue" checked> Magazine issue line</label>
      <label>Issue text <input id="issue-input" type="text" maxlength="30" value="VOL. 06 — LEONIDA"></label>
      <label class="check"><input type="checkbox" data-deco="barcode"> Barcode block</label>
      <label class="check"><input type="checkbox" data-deco="leak" checked> Light leak</label>
      <label class="check"><input type="checkbox" data-deco="grain"> Film grain</label>
      <label class="check"><input type="checkbox" data-deco="vignette" checked> Vignette</label>
      <label class="check"><input type="checkbox" data-deco="halftone"> Halftone dots</label>
    </fieldset>
  </aside>
</main>

<footer class="foot">Vice Hour is an original fan-made poster tool. Photos never leave your device — everything renders locally in your browser.</footer>

<script type="module" src="src/studio.js"></script>
</body>
</html>
